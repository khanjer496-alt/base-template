name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/uae-android-app-ui-muatsu
    paths-ignore:
      - '**.md'
      - 'scripts/test/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Sign releases with the Play upload key from the WAFRA_KEYSTORE_B64
      # repo secret (base64 of wafra-upload.jks). Until the secret is added,
      # a fresh throwaway key is generated so builds stay green — side-load
      # updates then need uninstall/reinstall, and Play uploads need the
      # real key.
      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.WAFRA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/wafra-upload.jks
            echo "Using the real upload keystore from secrets."
          else
            keytool -genkeypair -v -keystore android/app/wafra-upload.jks \
              -alias wafra -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass wafra-upload-2026 -keypass wafra-upload-2026 \
              -dname "CN=Wafra, OU=Wafra, O=Wafra, L=Dubai, C=AE"
            echo "::warning::WAFRA_KEYSTORE_B64 secret not set - signed with a throwaway key."
          fi
          cat >> android/app/build.gradle <<'EOG'

          android {
              signingConfigs {
                  upload {
                      storeFile file('wafra-upload.jks')
                      storePassword 'wafra-upload-2026'
                      keyAlias 'wafra'
                      keyPassword 'wafra-upload-2026'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.upload
                  }
              }
          }
          EOG

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Play Store bundle (AAB)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Rename outputs
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk wafra.apk
          cp android/app/build/outputs/bundle/release/app-release.aab wafra.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wafra-apk
          path: wafra.apk
          retention-days: 30

      - name: Upload Play bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: wafra-aab
          path: wafra.aab
          retention-days: 30
